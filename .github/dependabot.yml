version: 2

updates:
  # A new pandas or Polars release changes the numbers, and a comparison
  # against a version nobody runs is not a comparison. These pull requests are
  # the trigger for a fresh benchmark run rather than a routine merge, so they
  # are not grouped: each one gets its own before and after.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /suites/dbbench/kuma
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
